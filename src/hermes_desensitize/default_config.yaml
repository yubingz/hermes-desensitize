  - 5G
  - 4G
  - 3G

# ── 数量级模糊 ────────────────────────────────────────────
# 把"产值 3.5 亿"这类数据替换为 [数量级N]，保留"是数量级"这个语义，
# 但不泄露具体数值。留空列表则关闭该功能。
quantity:
  enabled: true
  # 触发模糊的指标词（正则片段，会被拼进完整正则）
  # ⚠️ 只列在这儿的词才会被模糊。"合同额/投资额/预算"等不在默认列表里 ——
  #    需要就加进来，否则会静默漏掉（不会报错，只是不脱敏）。
  #    这里用锚定的写法（如 合同额|合同金额|合同价）避免"合同额"匹配到别的词。
  keywords: "产能|产量|产值|年产|月产|日产|营收|销售额|利润|市场份额|市值|估值|合同额|合同金额|投资额|预算|成本|单价|报价"
  # 占位符前缀（最终形如 [数量级1]、[数量级2]）
  placeholder_prefix: "数量级"

# ── 路径脱敏 ──────────────────────────────────────────────
# 把家目录路径替换为 [路径N]，避免泄露用户名/目录结构。
path_masking:
  enabled: true
  # 需要识别的路径模式（正则）。默认覆盖 Linux/macOS 家目录与 Windows 用户目录。
  patterns:
    - "/home/[a-zA-Z0-9_.-]+(?:/[a-zA-Z0-9_.\\-/]+)?"
    - "/Users/[a-zA-Z0-9_.-]+(?:/[a-zA-Z0-9_.\\-/]+)?"
    - "[A-Z]:\\\\Users\\\\[a-zA-Z0-9_.-]+(?:\\\\[a-zA-Z0-9_.\\\\-]+)?"

# ── 行为开关 ──────────────────────────────────────────────
behavior:
  # 插件是否默认启用（也可用 /desensitize off 在会话内临时关闭）
  enabled_by_default: true
  # 正则回退：LLM 不可用/超时/解析失败时是否用正则兜底。强烈建议保持 true。
  regex_fallback: true
  # 调试日志（会记录脱敏前后片段，含敏感内容 —— 仅排障时开启）
  debug: false

# ── 命令输出语言 ──────────────────────────────────────────
# /desensitize 的反馈（确认、状态标签、错误、用法）用哪种语言。
#   both —— 英中双语，英文在前（默认；改动前只有中文，双语不丢任何读者）
#   en   —— 纯英文（国际用户）
#   zh   —— 纯中文（中文用户，输出最干净）
# 只影响命令文字，不影响脱敏行为本身。
ui:
  language: both
  # help 输出语言（on/off/status 之外的未知子命令）。默认 en：help 面向第一次
  # 使用、语言还没配的人，用英文保证读不了中文的人也看得懂。可选 en/zh/both。
  help_language: en
