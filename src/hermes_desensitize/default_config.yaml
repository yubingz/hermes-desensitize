# Hermes Desensitize — 默认配置
#
# 本文件是插件的用户可编辑配置。插件启动时读取：
#   1. 本文件（包内默认值）
#   2. ~/.hermes/desensitize.yaml（用户覆盖，若存在）
#   3. 环境变量 DESENSITIZE_*（最高优先级）
#
# 三处合并，后者覆盖前者。

# ── LLM 后端 ──────────────────────────────────────────────
# 用于语义识别敏感实体的本地/远程模型。识别失败或超时会自动回退正则。
llm:
  # "ollama" | "openai"（任何 OpenAI 兼容端点，含 SiliconFlow/vLLM/LM Studio）
  provider: ollama
  # ollama: 模型名（如 qwen3:8b）；openai: 端点上的模型 ID
  model: qwen3:8b
  # 单次调用的超时秒数。超时 → 该分段回退正则。长文本按 chunk_max_chars 分段，每段独立计时。
  timeout: 10
  # openai provider 时的 base_url（留空则读 OPENAI_BASE_URL 环境变量）
  base_url: ""
  # openai provider 时的 API key 环境变量名（不写明文 key）
  api_key_env: OPENAI_API_KEY
  # ollama provider 时的地址（留空则读 OLLAMA_HOST，再回退 127.0.0.1:11434）
  ollama_host: ""

# ── 分段 ──────────────────────────────────────────────────
# 超过此字符数的消息会被切段，逐段送 LLM（避免单次请求过大 / 超时）
chunk_max_chars: 2000

# ── 本体占位符 ────────────────────────────────────────────
# 这些是对话上下文自明的引用，用固定占位符（不编号），便于还原和阅读。
# 格式：[{regex 匹配的正则}, {替换成的固定占位符}]
self_patterns:
  - ["我们公司|我公司|我司|本公司", "[本公司]"]
  - ["我自己|我本人|本人", "[本人]"]
  - ["这个项目|此项目|本项目", "[本项目]"]

# ── 公开实体白名单 ────────────────────────────────────────
# 分词器可能把这些标为人名/机构名，但它们属于公共信息，不需要脱敏。
# 请按自己的语言/国家/行业调整 —— 这是最需要定制的一节。
# 默认给出一份通用的大中华区 + 国际知名实体列表。
public_entities:
  # 科技
  - 华为
  - 华为技术有限公司
  - 腾讯
  - 阿里巴巴
  - 百度
  - 字节跳动
  - 京东
  - 小米
  - 网易
  - 美团
  - 中兴
  - 中兴通讯
  - 三星
  - 苹果
  - 微软
  - 谷歌
  - 亚马逊
  - Meta
  - OpenAI
  - 特斯拉
  - 英伟达
  - 英特尔
  - 高通
  - IBM
  - Oracle
  - SAP
  # 电信运营商
  - 中国移动
  - 中国联通
  - 中国电信
  - 中国铁塔
  # 高校
  - 清华大学
  - 北京大学
  - 浙江大学
